[project]
name = "n2-gateway"
version = "0.2.0"
description = "Grupo 1 — gateway de borda da Planta N2 (OPC UA + UR -> envelope v1 -> MQTT, store-and-forward)"
requires-python = ">=3.11"
dependencies = [
  "asyncua>=1.1",
  "paho-mqtt>=2.0",
  "jsonschema>=4.21",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "amqtt>=0.11"]

[project.scripts]
n2-gateway = "n2_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/n2_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
